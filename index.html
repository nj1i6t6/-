<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧果蠅監控系統 - 即時數據儀表板</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { font-family: 'Microsoft JhengHei', '微軟正黑體', sans-serif; background-color: #1a1a2e; color: #e0e0e0; margin: 0; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #4a4e69; padding-bottom: 10px; }
        h1 { color: #a2d2ff; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background-color: #16213e; border-radius: 10px; padding: 20px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3); }
        .live-data h2 { text-align: center; margin-top: 0; color: #fca311; }
        .live-data #live-count { font-size: 80px; font-weight: bold; text-align: center; color: #ffffff; margin: 10px 0; text-shadow: 0 0 10px #fca311; }
        .device-status ul { list-style: none; padding: 0; }
        .device-status li { font-size: 18px; margin-bottom: 10px; }
        .status-ok { color: #9ef01a; font-weight: bold; }
        .status-id, #last-update { color: #a2d2ff; }
        .chart-container { grid-column: 1 / -1; }
        .time-selector { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; }
        .time-selector button { background-color: #4a4e69; color: #e0e0e0; border: 1px solid #a2d2ff; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-size: 16px; transition: background-color 0.3s, color 0.3s; }
        .time-selector button:hover { background-color: #a2d2ff; color: #16213e; }
        .time-selector button.active { background-color: #fca311; color: #16213e; border-color: #fca311; font-weight: bold; }
        .project-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; }
        .project-info img { width: 100%; height: auto; border-radius: 8px; margin-top: 10px; object-fit: cover; }
        footer { text-align: center; margin-top: 40px; color: #888; }
    </style>
</head>
<body>
    <header><h1>智慧果蠅監控系統 - 即時數據儀表板</h1></header>
    <main>
        <div class="dashboard">
            <div class="card live-data"><h2 id="live-count-title">當前累積捕獲總數</h2><p id="live-count">--</p></div>
            <div class="card device-status">
                <h2>設備狀態</h2>
                <ul>
                    <li>連線狀態：<span class="status-ok">正常 ✅</span></li>
                    <li>感測器ID：<span class="status-id">FF-TRAP-001</span></li>
                    <li>上次更新時間：<span id="last-update">--:--:--</span></li>
                </ul>
            </div>
            <div class="card chart-container">
                <div class="time-selector">
                    <button id="btn-24h" class="active">過去 24 小時</button>
                    <button id="btn-7d">過去 7 天</button>
                </div>
                <h2 id="chart-title">24小時捕獲趨勢圖</h2>
                <canvas id="fruit-fly-chart"></canvas>
            </div>
        </div>
        <div class="project-info">
            <div class="card">
                <h2>專案簡介</h2>
                <p>本專案設計一套自動化東方果實蠅誘引計數模組，透過結合 IoT 技術與雲端數據分析，實現對害蟲的實時監測與數據分析，協助農民準確掌握害蟲動態，推動精準農業發展。</p>
            </div>
            <div class="card">
                <h2>硬體實物</h2>
                <img src="https://i.imgur.com/R3sOU8W.jpeg" alt="果蠅捕蟲罐實物圖">
            </div>
        </div>
    </main>
    <footer><p>期末專題報告 - 謝維勳  蘇柏誠</p></footer>

    <script>
    document.addEventListener('DOMContentLoaded', function () {
        // ===== 全域變數與元素獲取 =====
        const liveCountElement = document.getElementById('live-count');
        const liveCountTitle = document.getElementById('live-count-title');
        const lastUpdateElement = document.getElementById('last-update');
        const chartTitleElement = document.getElementById('chart-title');
        const ctx = document.getElementById('fruit-fly-chart').getContext('2d');
        const btn24h = document.getElementById('btn-24h');
        const btn7d = document.getElementById('btn-7d');

        let chart;
        let liveUpdateInterval;
        let currentView = '24h';
        const MASTER_DATA_KEY = 'fruitFlyMasterData_v4'; // 使用新key避免舊快取
        let masterData = [];

        // ===== 數據模擬核心邏輯 =====

        // 輔助函數：將時間對齊到最近的上一個半點或整點
        function snapToHalfHour(date) {
            const snappedDate = new Date(date);
            const minutes = snappedDate.getMinutes();
            if (minutes >= 30) {
                snappedDate.setMinutes(30, 0, 0);
            } else {
                snappedDate.setMinutes(0, 0, 0);
            }
            return snappedDate;
        }

        function getFlyActivity(hour) {
            if (hour >= 8 && hour < 18) return 2 + Math.random() * 4;
            else if (hour >= 6 && hour < 8 || hour >= 18 && hour < 20) return 0.5 + Math.random() * 1.5;
            else return Math.random() * 0.5;
        }

        function getOrGenerateMasterData() {
            const cached = localStorage.getItem(MASTER_DATA_KEY);
            if (cached) {
                const { timestamp, data } = JSON.parse(cached);
                if (new Date(timestamp).toDateString() === new Date().toDateString()) {
                    masterData = data.map(item => ({ ...item, timestamp: new Date(item.timestamp) }));
                    return;
                }
            }

            console.log("Generating new master data with snapped timestamps...");
            masterData = [];
            const now = new Date();
            const endTime = snapToHalfHour(now);
            const startTime = snapToHalfHour(new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000));

            for (let time = new Date(startTime.getTime()); time <= endTime; time.setMinutes(time.getMinutes() + 30)) {
                masterData.push({
                    timestamp: new Date(time.getTime()),
                    catch: getFlyActivity(time.getHours())
                });
            }
            localStorage.setItem(MASTER_DATA_KEY, JSON.stringify({ timestamp: new Date().toISOString(), data: masterData }));
        }

        // 處理「過去7天」數據 (新定義：每日16:00結算值)
        function process7DayData() {
            const dailyFinalCounts = [];
            for (let i = 1; i <= 7; i++) { // 從昨天(i=1)到7天前(i=7)
                const targetDay = new Date();
                targetDay.setDate(targetDay.getDate() - i);
                
                const cycleEnd = new Date(targetDay);
                cycleEnd.setHours(16, 0, 0, 0); // 當天下午4點
                const cycleStart = new Date(cycleEnd);
                cycleStart.setDate(cycleStart.getDate() - 1); // 從前一天下午4點開始

                const dayData = masterData.filter(item => item.timestamp >= cycleStart && item.timestamp < cycleEnd);
                const total = dayData.reduce((sum, item) => sum + item.catch, 0);
                
                dailyFinalCounts.unshift({ // 從前面插入，保持日期順序
                    label: `${targetDay.getMonth() + 1}/${targetDay.getDate()}`,
                    count: Math.round(total)
                });
            }

            // 調整數據使其總量合理
            const avg = dailyFinalCounts.reduce((sum, item) => sum + item.count, 0) / 7;
            const scaleFactor = (avg > 0) ? (140 / avg) : 1;
            const data = dailyFinalCounts.map(item => Math.min(180, Math.max(100, Math.round(item.count * scaleFactor))));
            const labels = dailyFinalCounts.map(item => item.label);
            
            return { labels, data };
        }
        
        // 處理「過去24小時」數據
        function process24HourData() {
            const now = new Date();
            const endTime = snapToHalfHour(now);
            const startTime24h = new Date(endTime.getTime() - 24 * 60 * 60 * 1000);
            
            const relevantData = masterData.filter(item => item.timestamp >= startTime24h && item.timestamp <= endTime);
            if(relevantData.length === 0) return {labels: [], data: []};

            const labels = [];
            const data = [];
            let cumulativeCount = 0;

            const firstPointTime = relevantData[0].timestamp;
            let resetTimeForFirstPoint = new Date(firstPointTime);
            if (resetTimeForFirstPoint.getHours() < 16) {
                resetTimeForFirstPoint.setDate(resetTimeForFirstPoint.getDate() - 1);
            }
            resetTimeForFirstPoint.setHours(16, 0, 0, 0);
            
            const initialData = masterData.filter(item => item.timestamp >= resetTimeForFirstPoint && item.timestamp < firstPointTime);
            cumulativeCount = initialData.reduce((sum, item) => sum + item.catch, 0);
            
            relevantData.forEach(item => {
                const ts = item.timestamp;
                if (ts.getHours() === 16 && ts.getMinutes() === 0) {
                    const prevTimestamp = labels.length > 0 ? labels[labels.length - 1] : null;
                    if (!prevTimestamp || !prevTimestamp.startsWith("16:00")) {
                        cumulativeCount = 0;
                    }
                }
                
                cumulativeCount += item.catch;
                labels.push(ts.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }));
                data.push(Math.round(cumulativeCount));
            });

            return { labels, data };
        }

        // ===== 儀表板更新與繪製 =====
        function initializeChart() { /* ... 內容不變 ... */ }
        function updateDashboard() { /* ... 內容不變 ... */ }
        function simulateLiveUpdate() { /* ... 內容不變 ... */ }

        // --- 複製不變的函數 ---
        initializeChart = function() {
            if (chart) chart.destroy();
            chart = new Chart(ctx, {
                type: 'line',
                data: { labels: [], datasets: [{ label: '累積捕獲數量', data: [], borderColor: '#a2d2ff', backgroundColor: 'rgba(162, 210, 255, 0.2)', borderWidth: 2, fill: true, tension: 0.1 }] },
                options: {
                    scales: {
                        y: { beginAtZero: true, ticks: { color: '#e0e0e0' }, grid: { color: 'rgba(255, 255, 255, 0.1)' } },
                        x: { ticks: { color: '#e0e0e0' }, grid: { color: 'rgba(255, 255, 255, 0.1)' } }
                    },
                    plugins: { legend: { labels: { color: '#e0e0e0', font: { size: 16 } } } },
                    animation: { duration: 500 }
                }
            });
        }
        
        updateDashboard = function() {
            clearInterval(liveUpdateInterval);
            let dataToShow;

            if (currentView === '24h') {
                dataToShow = process24HourData();
                chart.data.datasets[0].label = '累積捕獲數量';
                chart.options.scales.y.beginAtZero = true;
                liveCountTitle.textContent = '當前累積捕獲總數';
                liveCountElement.textContent = dataToShow.data.length > 0 ? dataToShow.data[dataToShow.data.length - 1] : 0;
                lastUpdateElement.textContent = new Date().toLocaleTimeString('it-IT');
                chartTitleElement.textContent = '24小時捕獲趨勢圖';
                liveUpdateInterval = setInterval(simulateLiveUpdate, 5000);

            } else if (currentView === '7d') {
                dataToShow = process7DayData();
                chart.data.datasets[0].label = '每日結算總數';
                chart.options.scales.y.beginAtZero = false;
                liveCountTitle.textContent = '近7日平均結算數';
                const average = dataToShow.data.length > 0 ? Math.round(dataToShow.data.reduce((a, b) => a + b, 0) / dataToShow.data.length) : 0;
                liveCountElement.textContent = average;
                lastUpdateElement.textContent = 'N/A';
                chartTitleElement.textContent = '近7日結算總量圖';
            }
            chart.data.labels = dataToShow.labels;
            chart.data.datasets[0].data = dataToShow.data;
            chart.update();
        }

        simulateLiveUpdate = function() {
            if (currentView !== '24h') return;

            const now = new Date();
            const snappedNow = snapToHalfHour(now);
            const lastDataPoint = masterData[masterData.length - 1];

            if (snappedNow.getTime() > lastDataPoint.timestamp.getTime()) {
                 const newCatch = getFlyActivity(snappedNow.getHours());
                 masterData.push({ timestamp: snappedNow, catch: newCatch });
                 localStorage.setItem(MASTER_DATA_KEY, JSON.stringify({ timestamp: new Date().toISOString(), data: masterData }));
                 updateDashboard(); 
            } else {
                const newCatch = getFlyActivity(now.getHours()) / 360; 
                lastDataPoint.catch += newCatch;

                const dataArray = chart.data.datasets[0].data;
                const lastIndex = dataArray.length - 1;
                if (lastIndex >= 0) {
                  dataArray[lastIndex] += newCatch;
                  const newTotal = Math.round(dataArray[lastIndex]);
                  liveCountElement.textContent = newTotal;
                }
            }
            
            lastUpdateElement.textContent = now.toLocaleTimeString('it-IT');
            chart.update('none'); 
        }

        // ===== 事件監聽器 =====
        btn24h.addEventListener('click', () => { /* ... 內容不變 ... */ });
        btn7d.addEventListener('click', () => { /* ... 內容不變 ... */ });
        
        // --- 複製不變的監聽器 ---
        btn24h.addEventListener('click', () => {
            if (currentView === '24h') return;
            currentView = '24h';
            btn24h.classList.add('active');
            btn7d.classList.remove('active');
            updateDashboard();
        });

        btn7d.addEventListener('click', () => {
            if (currentView === '7d') return;
            currentView = '7d';
            btn7d.classList.add('active');
            btn24h.classList.remove('active');
            updateDashboard();
        });

        // ===== 頁面初始化 =====
        initializeChart();
        getOrGenerateMasterData();
        updateDashboard();
    });
    </script>
</body>
</html>
